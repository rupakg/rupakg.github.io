<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="580" fill="#f4f5f7" rx="16"/>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d1d5db"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- Dot grid -->
  <rect width="1200" height="580" fill="url(#dots)" rx="16"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#4b5563" letter-spacing="4">THE DRAFT-FIRST CHECK</text>

  <!--
    LAYOUT (all x-coords relative to cx=600)

    START box:        x=470, y=60, w=260, h=44  → cx=600, bottom=104
    Diamond 1:        cx=600, cy=168  (points: top=136, bottom=200, left=480, right=720)
    Diamond 2:        cx=600, cy=300  (points: top=268, bottom=332, left=480, right=720)

    RIGHT branch (NO draft): goes right from Diamond 1 right (720,168) → terminal box at x=800–1140, cy=168
    LEFT branch (YES+markers): goes left from Diamond 2 left (480,300) → terminal box at x=60–440, cy=300
    DOWN branch (NO markers): goes down from Diamond 2 bottom (600,332) → terminal box at cy=408
    DOWN branch (YES draft, no markers): goes right from Diamond 1 right, then...
      Actually: Diamond 1 YES → down to Diamond 2. Diamond 1 NO → right terminal.

    Arrows:
    - Start bottom (600,104) → Diamond 1 top (600,136): down
    - Diamond 1 NO (right, 720,168) → right terminal left edge (800,168): right
    - Diamond 1 YES (bottom, 600,200) → Diamond 2 top (600,268): down
    - Diamond 2 YES (left, 480,300) → left terminal right edge (440,300): left
    - Diamond 2 NO (bottom, 600,332) → bottom terminal top (600,380): down
  -->

  <!-- ══ START ══ -->
  <g filter="url(#shadow)">
    <rect x="470" y="60" width="260" height="44" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
    <text x="600" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">You type a command:</text>
    <text x="600" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#e9d5ff">/ai-newsletter [anything]</text>
  </g>

  <!-- START → Diamond 1 -->
  <line x1="600" y1="104" x2="600" y2="132" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══ DIAMOND 1: Draft exists? ══ -->
  <!-- Diamond points: top(600,136) right(724,172) bottom(600,208) left(476,172) -->
  <g filter="url(#shadow)">
    <polygon points="600,136 724,172 600,208 476,172" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Draft exists</text>
    <text x="600" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">in .tmp/?</text>
  </g>

  <!-- Label: YES (down) -->
  <text x="614" y="234" font-size="10" font-weight="700" fill="#059669">YES</text>
  <!-- Label: NO (right) -->
  <text x="736" y="168" font-size="10" font-weight="700" fill="#e11d48">NO</text>

  <!-- Diamond 1 YES → Diamond 2 (down) -->
  <line x1="600" y1="208" x2="600" y2="256" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Diamond 1 NO → right terminal -->
  <line x1="724" y1="172" x2="800" y2="172" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══ RIGHT TERMINAL: No draft — run full workflow ══ -->
  <g filter="url(#shadow)">
    <rect x="800" y="140" width="340" height="64" rx="10" fill="#ffffff" stroke="#4f6ef7" stroke-width="2"/>
    <rect x="800" y="140" width="340" height="5" rx="5" fill="#4f6ef7"/>
    <text x="970" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#4f6ef7">No draft found</text>
    <text x="970" y="184" text-anchor="middle" font-size="10" fill="#374151">Run researcher → writer → stop for review</text>
    <text x="970" y="197" text-anchor="middle" font-size="9" fill="#6b7280">Full pipeline executes from scratch</text>
  </g>

  <!-- ══ DIAMOND 2: [NEW ITEM] markers? ══ -->
  <!-- Diamond points: top(600,260) right(724,300) bottom(600,340) left(476,300) -->
  <g filter="url(#shadow)">
    <polygon points="600,260 724,300 600,340 476,300" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="600" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">[NEW ITEM]</text>
    <text x="600" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">markers found?</text>
  </g>

  <!-- Label: YES (left) -->
  <text x="420" y="296" font-size="10" font-weight="700" fill="#f59e0b">YES</text>
  <!-- Label: NO (down) -->
  <text x="610" y="364" font-size="10" font-weight="700" fill="#0891b2">NO</text>

  <!-- Diamond 2 YES → left terminal -->
  <line x1="476" y1="300" x2="440" y2="300" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Diamond 2 NO → bottom terminal -->
  <line x1="600" y1="340" x2="600" y2="388" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ══ LEFT TERMINAL: markers found — run writer ══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="260" width="380" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="60" y="260" width="380" height="5" rx="5" fill="#f59e0b"/>
    <text x="250" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">[NEW ITEM] markers found</text>
    <text x="250" y="302" text-anchor="middle" font-size="10" fill="#374151">Run writer agent to fetch sources</text>
    <text x="250" y="316" text-anchor="middle" font-size="10" fill="#374151">and write formatted items</text>
    <text x="250" y="332" text-anchor="middle" font-size="9" fill="#6b7280">Then stop — wait for user review</text>
  </g>

  <!-- ══ BOTTOM TERMINAL: no markers — ready to publish ══ -->
  <g filter="url(#shadow)">
    <rect x="380" y="388" width="440" height="80" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <rect x="380" y="388" width="440" height="5" rx="5" fill="#0891b2"/>
    <text x="600" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">No markers — draft is ready</text>
    <text x="600" y="430" text-anchor="middle" font-size="10" fill="#374151">Inform user: draft exists, ready for review</text>
    <text x="600" y="446" text-anchor="middle" font-size="10" fill="#374151">or run publish to finalize</text>
    <text x="600" y="462" text-anchor="middle" font-size="9" fill="#6b7280">System stops. Nothing runs without your say-so.</text>
  </g>

  <!-- ══ MARKER SCAN callout (right side, below right terminal) ══ -->
  <g filter="url(#shadow)">
    <rect x="800" y="230" width="340" height="192" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <rect x="800" y="230" width="340" height="5" rx="5" fill="#374151"/>
    <text x="820" y="252" font-size="9" font-weight="700" fill="#9ca3af" letter-spacing="1">MARKER SCAN REPORT</text>
    <text x="820" y="270" font-size="9" fill="#6ee7b7">[NEW ITEM] markers found (1):</text>
    <text x="828" y="284" font-size="8.5" fill="#d1fae5">Line 93: Claude adds memory...</text>
    <text x="820" y="302" font-size="9" fill="#fca5a5">[DO NOT PUBLISH] markers (2):</text>
    <text x="828" y="316" font-size="8.5" fill="#fee2e2">Line 23: Google DeepMind...</text>
    <text x="828" y="330" font-size="8.5" fill="#fee2e2">Line 41: CME Group GPU...</text>
    <line x1="820" y1="342" x2="1128" y2="342" stroke="#374151" stroke-width="1"/>
    <text x="820" y="358" font-size="9" font-weight="700" fill="#fbbf24">Proceed? (yes / no)</text>
    <text x="820" y="374" font-size="8.5" fill="#9ca3af">Nothing runs until you confirm.</text>
    <text x="820" y="388" font-size="8.5" fill="#9ca3af">Say no to edit more.</text>
    <text x="820" y="402" font-size="8.5" fill="#9ca3af">Say yes to continue.</text>
    <text x="820" y="416" font-size="8.5" fill="#9ca3af">Always shown before any agent runs.</text>
  </g>

  <!-- Connecting line from right terminal bottom to scan report top -->
  <line x1="970" y1="204" x2="970" y2="230" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ─── FOOTER ─── -->
  <path d="M0,496 L1200,496 L1200,564 Q1200,580 1184,580 L16,580 Q0,580 0,564 Z" fill="#e8eaf0"/>
  <line x1="0" y1="496" x2="1200" y2="496" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="600" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" font-style="italic">
    "Close your laptop mid-workflow, come back two days later — the system picks up exactly where you left off."
  </text>
  <text x="600" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="1">rupakganguly.com</text>

</svg>
