    <line x1="9" y1="18" x2="9" y2="8" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="14" y1="18" x2="14" y2="11" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="19" y1="18" x2="19" y2="5" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round"/>
  </g>
