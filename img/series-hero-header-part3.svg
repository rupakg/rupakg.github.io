<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d1d5db"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#7dd3fc"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-review" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#f4f5f7" rx="16"/>
  <rect width="1200" height="560" fill="url(#dots)" rx="16"/>

  <!-- Top Banner: Eyebrow -->
  <rect x="420" y="22" width="360" height="20" rx="10" fill="#eef0fe"/>
  <text x="600" y="36" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#4f6ef7" text-anchor="middle" letter-spacing="2">5-PART BLOG SERIES</text>

  <!-- Top Banner: Title -->
  <text x="600" y="76" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#1f2937" text-anchor="middle">How I Automated My Weekly AI Newsletter</text>
