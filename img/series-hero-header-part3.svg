  <text x="1016" y="328" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#1f2937" text-anchor="middle">What Shipped,</text>
  <text x="1016" y="343" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#1f2937" text-anchor="middle">What Broke</text>
  <!-- Description -->
  <text x="1016" y="361" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Actual outputs, real</text>
  <text x="1016" y="375" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">failures, and how to</text>
