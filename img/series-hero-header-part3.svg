  <line x1="0" y1="476" x2="1200" y2="476" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="600" y="508" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle" font-style="italic">"Prompts are the code. The directive is the SOP. The agents are your specialists. The human has the control."</text>
  <text x="600" y="542" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="1">rupakganguly.com</text>
