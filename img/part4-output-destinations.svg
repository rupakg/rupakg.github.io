<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Inter, Helvetica Neue, Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="620" fill="#f4f5f7" rx="16"/>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d1d5db"/>
    </pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-pub" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0891b218"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 Z" fill="#db2777"/>
    </marker>
  </defs>

  <!-- Dot grid -->
  <rect width="1200" height="620" fill="url(#dots)" rx="16"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#4b5563" letter-spacing="4">WHAT THE SYSTEM PUBLISHES EACH WEEK</text>

  <!--
    LAYOUT
    Publisher: x=60, y=88, w=260, h=360, cx=190, right=320, center_y=268
    Dest cards: x=560, w=580, h=68, gap=12
      card y: 88, 172, 256, 340, 424
      card centers y: 122, 206, 290, 374, 458
    Fan lines: (320,268) to (490, card_cy) to (560, card_cy)
    Footer at y=504
  -->

  <!-- ══ PUBLISHER CARD ══ -->
  <g filter="url(#shadow-pub)">
    <rect x="60" y="88" width="260" height="360" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <rect x="60" y="88" width="260" height="5" rx="5" fill="#0891b2"/>

    <!-- Icon circle -->
    <circle cx="190" cy="162" r="32" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <!-- Upload/publish icon: box with up arrow -->
    <g transform="translate(176,148)" fill="none" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="14" width="28" height="14" rx="2" fill="#ecfeff" stroke="#0891b2"/>
      <line x1="14" y1="11" x2="14" y2="0"/>
      <polyline points="8,6 14,0 20,6"/>
    </g>

    <text x="190" y="213" text-anchor="middle" font-size="13" font-weight="800" fill="#0e7490" letter-spacing="1">PUBLISHER</text>
    <text x="190" y="229" text-anchor="middle" font-size="10" fill="#6b7280">newsletter-publisher.md</text>

    <line x1="76" y1="242" x2="304" y2="242" stroke="#e5e7eb" stroke-width="1"/>

    <text x="80" y="260" font-size="9" font-weight="700" fill="#374151">INPUTS:</text>
    <text x="80" y="275" font-size="9" fill="#6b7280">Reviewed draft with markers</text>
    <text x="80" y="289" font-size="9" fill="#6b7280">Existing processed file (if any)</text>

    <line x1="76" y1="302" x2="304" y2="302" stroke="#e5e7eb" stroke-width="1"/>

    <text x="80" y="320" font-size="9" font-weight="700" fill="#374151">STEPS BEFORE PUBLISH:</text>
    <text x="80" y="336" font-size="9" fill="#6b7280">1. Scan and report markers</text>
    <text x="80" y="350" font-size="9" fill="#6b7280">2. Remove [DO NOT PUBLISH] items</text>
    <text x="80" y="364" font-size="9" fill="#6b7280">3. Strip News Date fields</text>
    <text x="80" y="378" font-size="9" fill="#6b7280">4. Fix sub-bullet indentation</text>
    <text x="80" y="392" font-size="9" fill="#6b7280">5. Generate Intro + Takeaways</text>
    <text x="80" y="406" font-size="9" fill="#6b7280">6. Publish to selected destinations</text>

    <rect x="76" y="424" width="228" height="18" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="190" y="437" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0e7490" letter-spacing="1">PUBLISH AGENT</text>
  </g>

  <!-- Sublabel -->
  <text x="190" y="462" text-anchor="middle" font-size="9" font-weight="600" fill="#0891b2" letter-spacing="1.5">.claude/agents/newsletter-publisher.md</text>

  <!--
    Fan lines from cx=320 (right edge of publisher) to dest cards at x=560
    Publisher center_y = 88 + 360/2 = 268
    Card centers: 122, 206, 290, 374, 458
    Spine x = 490
    Lines: (320, 268) → (490, dest_cy) → (552, dest_cy)
  -->

  <!-- Spine vertical line (faint guide, not needed — fan lines do it) -->

  <!-- Fan line 1 → Disk (y=122) -->
  <polyline points="320,268 490,122 552,122" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="552" y1="122" x2="560" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Fan line 2 → Notion (y=206) -->
  <polyline points="320,268 490,206 552,206" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>
  <line x1="552" y1="206" x2="560" y2="206" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Fan line 3 → Substack (y=290) -->
  <polyline points="320,268 490,290 552,290" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>
  <line x1="552" y1="290" x2="560" y2="290" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Fan line 4 → Hero Image (y=374) -->
  <polyline points="320,268 490,374 552,374" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
  <line x1="552" y1="374" x2="560" y2="374" stroke="#db2777" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <!-- Fan line 5 → Social Posts (y=458) -->
  <polyline points="320,268 490,458 552,458" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
  <line x1="552" y1="458" x2="560" y2="458" stroke="#db2777" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <!-- ══ DESTINATION CARDS ══ -->

  <!-- 1. Disk -->
  <g filter="url(#shadow)">
    <rect x="560" y="88" width="580" height="68" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="560" y="88" width="580" height="5" rx="5" fill="#64748b"/>
    <text x="580" y="118" font-size="10" font-weight="800" fill="#1f2937">DISK</text>
    <text x="580" y="134" font-size="9" fill="#6b7280">output/ai-newsletter/newsletter-ai-news-{date}.md</text>
    <rect x="1060" y="100" width="68" height="16" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="1094" y="112" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.5">ARCHIVE</text>
  </g>

  <!-- 2. Notion -->
  <g filter="url(#shadow)">
    <rect x="560" y="172" width="580" height="68" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="560" y="172" width="580" height="5" rx="5" fill="#0891b2"/>
    <text x="580" y="202" font-size="10" font-weight="800" fill="#1f2937">NOTION</text>
    <text x="580" y="218" font-size="9" fill="#6b7280">New page under &quot;Latest in AI Newsletter&quot; parent. Used for final formatting review.</text>
    <rect x="1048" y="184" width="80" height="16" rx="6" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <text x="1088" y="196" text-anchor="middle" font-size="8" font-weight="700" fill="#0e7490" letter-spacing="0.5">PUBLISHED</text>
  </g>

  <!-- 3. Substack -->
  <g filter="url(#shadow)">
    <rect x="560" y="256" width="580" height="68" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="560" y="256" width="580" height="5" rx="5" fill="#0891b2"/>
    <text x="580" y="286" font-size="10" font-weight="800" fill="#1f2937">SUBSTACK</text>
    <text x="580" y="302" font-size="9" fill="#6b7280">Always saved as a draft. Never auto-published. You review and publish from the dashboard.</text>
    <rect x="1052" y="268" width="76" height="16" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="1090" y="280" text-anchor="middle" font-size="8" font-weight="700" fill="#c2410c" letter-spacing="0.5">DRAFT ONLY</text>
  </g>

  <!-- 4. Hero Image -->
  <g filter="url(#shadow)">
    <rect x="560" y="340" width="580" height="68" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="560" y="340" width="580" height="5" rx="5" fill="#db2777"/>
    <text x="580" y="370" font-size="10" font-weight="800" fill="#1f2937">HERO IMAGE</text>
    <text x="580" y="386" font-size="9" fill="#6b7280">.tmp/newsletter-hero-image/latest-in_ai-news_hero_{date}.jpg · Keywords filtered for cut items</text>
    <rect x="1048" y="352" width="80" height="16" rx="6" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
    <text x="1088" y="364" text-anchor="middle" font-size="8" font-weight="700" fill="#be185d" letter-spacing="0.5">COVER IMAGE</text>
  </g>

  <!-- 5. Social Posts -->
  <g filter="url(#shadow)">
    <rect x="560" y="424" width="580" height="68" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="560" y="424" width="580" height="5" rx="5" fill="#db2777"/>
    <text x="580" y="454" font-size="10" font-weight="800" fill="#1f2937">SOCIAL POSTS</text>
    <text x="580" y="470" font-size="9" fill="#6b7280">3 variations each for X, LinkedIn, and Facebook. Generated from the published newsletter.</text>
    <rect x="1036" y="436" width="92" height="16" rx="6" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
    <text x="1082" y="448" text-anchor="middle" font-size="8" font-weight="700" fill="#be185d" letter-spacing="0.5">READY TO POST</text>
  </g>

  <!-- ─── FOOTER ─── -->
  <path d="M0,528 L1200,528 L1200,604 Q1200,620 1184,620 L16,620 Q0,620 0,604 Z" fill="#e8eaf0"/>
  <line x1="0" y1="528" x2="1200" y2="528" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="600" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" font-style="italic">
    &quot;Every failure became a permanent improvement. The system gets stronger, not just with success.&quot;
  </text>
  <text x="600" y="602" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="1">rupakganguly.com</text>

</svg>
