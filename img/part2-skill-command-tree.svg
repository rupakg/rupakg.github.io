<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="580" fill="#f4f5f7" rx="16"/>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d1d5db"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-root" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed28"/>
    </filter>
  </defs>

  <!-- Dot grid -->
  <rect width="1200" height="580" fill="url(#dots)" rx="16"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#4b5563" letter-spacing="4">THE /ai-newsletter SKILL COMMAND TREE</text>

  <!--
    LAYOUT
    Root node: cx=600, y=64, w=260, h=44 → bottom=108
    Horizontal spine: y=148 (40px below root bottom)
    Vertical drop from root: y=108 → y=148
    4 branch columns centered at: x=150, x=400, x=800, x=1050
    Branch group headers: y=148→200 (h=52)
    Branch header bottoms: y=200
    Command pills: y=214 downward, h=30, gap=10

    Connector lines:
    - Root bottom center: (600, 108)
    - Vertical drop: (600, 108)→(600, 148)
    - Horizontal spine: (150, 148)→(1050, 148)
    - Drop lines to group headers: x=150,400,800,1050 from y=148→160
  -->

  <!-- ══ ROOT NODE ══ -->
  <g filter="url(#shadow-root)">
    <rect x="470" y="64" width="260" height="44" rx="22" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
    <text x="600" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">/ai-newsletter</text>
  </g>

  <!-- Root to spine -->
  <line x1="600" y1="108" x2="600" y2="148" stroke="#7c3aed" stroke-width="2"/>
  <!-- Horizontal spine -->
  <line x1="150" y1="148" x2="1050" y2="148" stroke="#7c3aed" stroke-width="2"/>
  <!-- Drop lines to group headers -->
  <line x1="150"  y1="148" x2="150"  y2="163" stroke="#7c3aed" stroke-width="2"/>
  <line x1="400"  y1="148" x2="400"  y2="163" stroke="#7c3aed" stroke-width="2"/>
  <line x1="800"  y1="148" x2="800"  y2="163" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1050" y1="148" x2="1050" y2="163" stroke="#7c3aed" stroke-width="2"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- BRANCH 1: FULL WORKFLOW  cx=150 -->
  <!-- ══════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="163" width="180" height="52" rx="8" fill="#4f6ef7" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="150" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">FULL WORKFLOW</text>
    <text x="150" y="200" text-anchor="middle" font-size="9" fill="#c7d2fe">Research → Write → Review</text>
    <text x="150" y="212" text-anchor="middle" font-size="9" fill="#c7d2fe">→ Publish</text>
  </g>

  <!-- Drop line from group to first pill -->
  <line x1="150" y1="215" x2="150" y2="234" stroke="#4f6ef7" stroke-width="1.5"/>

  <!-- Command pills - Full Workflow -->
  <!-- Pill 1: /ai-newsletter -->
  <g filter="url(#shadow)">
    <rect x="60" y="234" width="180" height="30" rx="6" fill="#ffffff" stroke="#4f6ef7" stroke-width="1.5"/>
    <text x="150" y="254" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4f6ef7">/ai-newsletter</text>
  </g>
  <!-- Pill 2: week -->
  <line x1="150" y1="264" x2="150" y2="278" stroke="#4f6ef7" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="60" y="278" width="180" height="44" rx="6" fill="#ffffff" stroke="#4f6ef7" stroke-width="1.5"/>
    <text x="150" y="296" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4f6ef7">/ai-newsletter week</text>
    <text x="150" y="312" text-anchor="middle" font-size="8.5" fill="#4f6ef7">"YYYY-MM-DD"</text>
  </g>

  <!-- Natural language note -->
  <rect x="56" y="336" width="188" height="54" rx="6" fill="#eef0fe" stroke="#a5b4fc" stroke-width="1"/>
  <text x="150" y="353" text-anchor="middle" font-size="8.5" font-weight="600" fill="#4f6ef7">Natural language works too:</text>
  <text x="150" y="367" text-anchor="middle" font-size="8" fill="#6b7280">"generate this week's newsletter"</text>
  <text x="150" y="379" text-anchor="middle" font-size="8" fill="#6b7280">"create newsletter for July 18"</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- BRANCH 2: RESEARCH + WRITE  cx=400 -->
  <!-- ══════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="304" y="163" width="192" height="52" rx="8" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <text x="400" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">RESEARCH + WRITE</text>
    <text x="400" y="200" text-anchor="middle" font-size="9" fill="#a7f3d0">Run individual pipeline</text>
    <text x="400" y="212" text-anchor="middle" font-size="9" fill="#a7f3d0">stages independently</text>
  </g>

  <line x1="400" y1="215" x2="400" y2="234" stroke="#059669" stroke-width="1.5"/>

  <!-- Pill 1: research -->
  <g filter="url(#shadow)">
    <rect x="304" y="234" width="192" height="30" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="400" y="254" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">/ai-newsletter research</text>
  </g>
  <line x1="400" y1="264" x2="400" y2="278" stroke="#059669" stroke-width="1.5"/>
  <!-- Pill 2: write -->
  <g filter="url(#shadow)">
    <rect x="304" y="278" width="192" height="30" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="400" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">/ai-newsletter write</text>
  </g>

  <!-- Natural language note -->
  <rect x="300" y="322" width="200" height="64" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="400" y="339" text-anchor="middle" font-size="8.5" font-weight="600" fill="#059669">Natural language works too:</text>
  <text x="400" y="353" text-anchor="middle" font-size="8" fill="#6b7280">"just research AI news"</text>
  <text x="400" y="366" text-anchor="middle" font-size="8" fill="#6b7280">"gather news for this week"</text>
  <text x="400" y="379" text-anchor="middle" font-size="8" fill="#6b7280">"write from existing research"</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- BRANCH 3: PUBLISH  cx=800 -->
  <!-- ══════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="692" y="163" width="216" height="52" rx="8" fill="#0891b2" stroke="#0e7490" stroke-width="1.5"/>
    <text x="800" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">PUBLISH</text>
    <text x="800" y="200" text-anchor="middle" font-size="9" fill="#a5f3fc">Route to one or more</text>
    <text x="800" y="212" text-anchor="middle" font-size="9" fill="#a5f3fc">output destinations</text>
  </g>

  <line x1="800" y1="215" x2="800" y2="234" stroke="#0891b2" stroke-width="1.5"/>

  <!-- Publish pills - 5 of them -->
  <g filter="url(#shadow)">
    <rect x="692" y="234" width="216" height="30" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="800" y="254" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">/ai-newsletter publish disk</text>
  </g>
  <line x1="800" y1="264" x2="800" y2="278" stroke="#0891b2" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="692" y="278" width="216" height="30" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="800" y="298" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">/ai-newsletter publish notion</text>
  </g>
  <line x1="800" y1="308" x2="800" y2="322" stroke="#0891b2" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="692" y="322" width="216" height="30" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="800" y="342" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">/ai-newsletter publish substack</text>
  </g>
  <line x1="800" y1="352" x2="800" y2="366" stroke="#0891b2" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="692" y="366" width="216" height="44" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="800" y="384" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">/ai-newsletter publish both</text>
    <text x="800" y="400" text-anchor="middle" font-size="8.5" fill="#0891b2">disk + notion</text>
  </g>
  <line x1="800" y1="410" x2="800" y2="424" stroke="#0891b2" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="692" y="424" width="216" height="44" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="800" y="442" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">/ai-newsletter publish all</text>
    <text x="800" y="458" text-anchor="middle" font-size="8.5" fill="#0891b2">disk + notion + substack</text>
  </g>

  <!-- ══════════════════════════════════════════ -->
  <!-- BRANCH 4: UTILITIES  cx=1050 -->
  <!-- ══════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <rect x="956" y="163" width="188" height="52" rx="8" fill="#db2777" stroke="#be185d" stroke-width="1.5"/>
    <text x="1050" y="184" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">UTILITIES</text>
    <text x="1050" y="200" text-anchor="middle" font-size="9" fill="#fbcfe8">Hero image, help,</text>
    <text x="1050" y="212" text-anchor="middle" font-size="9" fill="#fbcfe8">and editorial tools</text>
  </g>

  <line x1="1050" y1="215" x2="1050" y2="234" stroke="#db2777" stroke-width="1.5"/>

  <!-- Pill 1: hero -->
  <g filter="url(#shadow)">
    <rect x="956" y="234" width="188" height="44" rx="6" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
    <text x="1050" y="252" text-anchor="middle" font-size="9.5" font-weight="700" fill="#db2777">/ai-newsletter hero</text>
    <text x="1050" y="268" text-anchor="middle" font-size="8.5" fill="#db2777">"keyword1, keyword2, ..."</text>
  </g>
  <line x1="1050" y1="278" x2="1050" y2="296" stroke="#db2777" stroke-width="1.5"/>
  <!-- Pill 2: help -->
  <g filter="url(#shadow)">
    <rect x="956" y="296" width="188" height="30" rx="6" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
    <text x="1050" y="316" text-anchor="middle" font-size="9.5" font-weight="700" fill="#db2777">/ai-newsletter help</text>
  </g>

  <!-- Markers note -->
  <rect x="952" y="342" width="196" height="88" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
  <text x="1050" y="359" text-anchor="middle" font-size="8.5" font-weight="600" fill="#db2777">Review markers:</text>
  <text x="1050" y="374" text-anchor="middle" font-size="8" fill="#6b7280">[DO NOT PUBLISH]</text>
  <text x="1050" y="386" text-anchor="middle" font-size="8" fill="#6b7280">before a headline to cut it</text>
  <text x="1050" y="400" text-anchor="middle" font-size="8" fill="#6b7280">[NEW ITEM] description</text>
  <text x="1050" y="412" text-anchor="middle" font-size="8" fill="#6b7280">Source: url  to add one</text>
  <text x="1050" y="424" text-anchor="middle" font-size="8" fill="#6b7280">No code. Just text.</text>

  <!-- ─── FOOTER ─── -->
  <path d="M0,492 L1200,492 L1200,564 Q1200,580 1184,580 L16,580 Q0,580 0,564 Z" fill="#e8eaf0"/>
  <line x1="0" y1="492" x2="1200" y2="492" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="600" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" font-style="italic">
    "Natural language works just as well as the slash commands. The skill interprets intent."
  </text>
  <text x="600" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="1">rupakganguly.com</text>

</svg>
