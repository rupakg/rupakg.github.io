    <line x1="4" y1="16" x2="4" y2="10"/>
    <line x1="9" y1="16" x2="9" y2="7"/>
    <line x1="14" y1="16" x2="14" y2="12"/>
    <line x1="19" y1="16" x2="19" y2="5"/>
    <line x1="1" y1="18" x2="23" y2="18"/>
  </g>
  <!-- Title -->
  <text x="1016" y="332" font-size="12" font-weight="800" fill="#92400e" letter-spacing="0.5" text-anchor="middle">What Shipped,</text>
  <text x="1016" y="347" font-size="12" font-weight="800" fill="#92400e" letter-spacing="0.5" text-anchor="middle">What Broke</text>
  <!-- Desc -->
  <text x="1016" y="365" font-size="10" fill="#78350f" text-anchor="middle">Actual outputs, real</text>
  <text x="1016" y="379" font-size="10" fill="#78350f" text-anchor="middle">failures, and how to</text>
  <text x="1016" y="393" font-size="10" fill="#78350f" text-anchor="middle">apply this anywhere</text>
  <!-- Bottom badge -->
  <rect x="945" y="418" width="142" height="16" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="1016" y="430" font-size="9" font-weight="700" fill="#d97706" letter-spacing="1" text-anchor="middle">OUTPUTS · LEARNINGS</text>

  <!-- Footer -->
  <path d="M0,476 L1200,476 L1200,544 Q1200,560 1184,560 L16,560 Q0,560 0,544 Z" fill="#e8eaf0"/>
  <line x1="0" y1="476" x2="1200" y2="476" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="600" y="508" font-size="13" font-weight="700" fill="#374151" font-style="italic" text-anchor="middle">"Prompts are the code. The directive is the SOP. The agents are your specialists. The human has the control."</text>
  <text x="600" y="542" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="1" text-anchor="middle">rupakganguly.com</text>
