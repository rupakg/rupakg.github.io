  <text x="600" y="76" font-size="26" font-weight="800" fill="#1f2937" text-anchor="middle">How I Automated My Weekly AI Newsletter</text>
  <text x="600" y="104" font-size="26" font-weight="800" fill="#1f2937" text-anchor="middle">with an AI Agentic Workflow</text>

