<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="580" fill="#f4f5f7" rx="16"/>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d1d5db"/>
    </pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-before" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef444428"/>
    </filter>
    <filter id="shadow-after" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#05966928"/>
    </filter>
  </defs>

  <!-- Dot grid -->
  <rect width="1200" height="580" fill="url(#dots)" rx="16"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#4b5563" letter-spacing="4">NEWSLETTER PRODUCTION: BEFORE vs. AFTER</text>

  <!--
    LAYOUT
    Two cards:
    Before: x=60, y=64, w=500, h=360 → cx=310, right=560
    After:  x=640, y=64, w=500, h=360 → cx=890, right=1140
    Gap=80 (VS arrow in center at x=600)
  -->

  <!-- ══ BEFORE CARD ══ -->
  <g filter="url(#shadow-before)">
    <rect x="60" y="64" width="500" height="392" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="60" y="64" width="500" height="5" rx="5" fill="#ef4444"/>

    <!-- Header -->
    <rect x="60" y="69" width="500" height="72" rx="0" fill="#fef2f2"/>
    <text x="310" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626" letter-spacing="2">BEFORE</text>
    <text x="310" y="124" text-anchor="middle" font-size="11" fill="#9ca3af">Manual newsletter production</text>

    <!-- Big time number -->
    <text x="310" y="202" text-anchor="middle" font-size="56" font-weight="800" fill="#ef4444" letter-spacing="-2">3–4</text>
    <text x="310" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#ef4444">HOURS PER WEEK</text>

    <line x1="76" y1="242" x2="544" y2="242" stroke="#fee2e2" stroke-width="1.5"/>

    <text x="80" y="264" font-size="10" font-weight="700" fill="#374151">WHERE THE TIME WENT:</text>

    <!-- Time breakdown rows -->
    <!-- Research -->
    <text x="80" y="284" font-size="9.5" fill="#6b7280">Research (scanning 10+ sources manually)</text>
    <rect x="80" y="290" width="320" height="8" rx="4" fill="#fee2e2"/>
    <rect x="80" y="290" width="260" height="8" rx="4" fill="#ef4444"/>
    <text x="410" y="299" font-size="9" font-weight="700" fill="#dc2626">~75 min</text>

    <!-- Writing + formatting -->
    <text x="80" y="320" font-size="9.5" fill="#6b7280">Writing + formatting each news item</text>
    <rect x="80" y="326" width="320" height="8" rx="4" fill="#fee2e2"/>
    <rect x="80" y="326" width="200" height="8" rx="4" fill="#ef4444"/>
    <text x="410" y="335" font-size="9" font-weight="700" fill="#dc2626">~60 min</text>

    <!-- Notion + Substack -->
    <text x="80" y="356" font-size="9.5" fill="#6b7280">Publishing to Notion and Substack</text>
    <rect x="80" y="362" width="320" height="8" rx="4" fill="#fee2e2"/>
    <rect x="80" y="362" width="120" height="8" rx="4" fill="#ef4444"/>
    <text x="410" y="371" font-size="9" font-weight="700" fill="#dc2626">~30 min</text>

    <!-- Hero image + social -->
    <text x="80" y="392" font-size="9.5" fill="#6b7280">Hero image + social posts (manual)</text>
    <rect x="80" y="398" width="320" height="8" rx="4" fill="#fee2e2"/>
    <rect x="80" y="398" width="80" height="8" rx="4" fill="#ef4444"/>
    <text x="410" y="407" font-size="9" font-weight="700" fill="#dc2626">~20 min</text>

    <line x1="76" y1="418" x2="544" y2="418" stroke="#fee2e2" stroke-width="1.5"/>

    <text x="310" y="440" text-anchor="middle" font-size="9.5" fill="#9ca3af" font-style="italic">+ cognitive overhead of context-switching between tasks</text>
  </g>

  <!-- Sublabel -->
  <text x="310" y="470" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444" letter-spacing="1.5">EVERY. SINGLE. WEEK.</text>

  <!-- VS badge in center -->
  <circle cx="600" cy="250" r="30" fill="#f4f5f7" stroke="#d1d5db" stroke-width="2"/>
  <text x="600" y="256" text-anchor="middle" font-size="16" font-weight="800" fill="#6b7280">VS</text>

  <!-- ══ AFTER CARD ══ -->
  <g filter="url(#shadow-after)">
    <rect x="640" y="64" width="500" height="392" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="640" y="64" width="500" height="5" rx="5" fill="#059669"/>

    <!-- Header -->
    <rect x="640" y="69" width="500" height="72" rx="0" fill="#f0fdf4"/>
    <text x="890" y="104" text-anchor="middle" font-size="18" font-weight="800" fill="#059669" letter-spacing="2">AFTER</text>
    <text x="890" y="124" text-anchor="middle" font-size="11" fill="#9ca3af">AI-assisted newsletter production</text>

    <!-- Big time number -->
    <text x="890" y="202" text-anchor="middle" font-size="56" font-weight="800" fill="#059669" letter-spacing="-2">15</text>
    <text x="890" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#059669">MINUTES PER WEEK</text>

    <line x1="656" y1="242" x2="1124" y2="242" stroke="#d1fae5" stroke-width="1.5"/>

    <text x="660" y="264" font-size="10" font-weight="700" fill="#374151">WHERE YOUR TIME GOES NOW:</text>

    <!-- Time breakdown rows -->
    <!-- Run command -->
    <text x="660" y="284" font-size="9.5" fill="#6b7280">Type /ai-newsletter and wait</text>
    <rect x="660" y="290" width="320" height="8" rx="4" fill="#d1fae5"/>
    <rect x="660" y="290" width="20" height="8" rx="4" fill="#059669"/>
    <text x="990" y="299" font-size="9" font-weight="700" fill="#059669">~2 min</text>

    <!-- Review draft -->
    <text x="660" y="320" font-size="9.5" fill="#6b7280">Read + edit the draft (human judgment)</text>
    <rect x="660" y="326" width="320" height="8" rx="4" fill="#d1fae5"/>
    <rect x="660" y="326" width="200" height="8" rx="4" fill="#059669"/>
    <text x="990" y="335" font-size="9" font-weight="700" fill="#059669">~10 min</text>

    <!-- Confirm + publish -->
    <text x="660" y="356" font-size="9.5" fill="#6b7280">Confirm publish and review Substack draft</text>
    <rect x="660" y="362" width="320" height="8" rx="4" fill="#d1fae5"/>
    <rect x="660" y="362" width="24" height="8" rx="4" fill="#059669"/>
    <text x="990" y="371" font-size="9" font-weight="700" fill="#059669">~3 min</text>

    <!-- Social posts -->
    <text x="660" y="392" font-size="9.5" fill="#6b7280">Hero image + social posts: automated</text>
    <rect x="660" y="398" width="320" height="8" rx="4" fill="#d1fae5"/>
    <rect x="660" y="398" width="4" height="8" rx="4" fill="#059669"/>
    <text x="990" y="407" font-size="9" font-weight="700" fill="#059669">~0 min</text>

    <line x1="656" y1="418" x2="1124" y2="418" stroke="#d1fae5" stroke-width="1.5"/>

    <text x="890" y="440" text-anchor="middle" font-size="9.5" fill="#9ca3af" font-style="italic">AI handles the overhead. You handle the judgment.</text>
  </g>

  <!-- Sublabel -->
  <text x="890" y="470" text-anchor="middle" font-size="9" font-weight="600" fill="#059669" letter-spacing="1.5">SINCE FEBRUARY 2026.</text>

  <!-- ─── FOOTER ─── -->
  <path d="M0,488 L1200,488 L1200,564 Q1200,580 1184,580 L16,580 Q0,580 0,564 Z" fill="#e8eaf0"/>
  <line x1="0" y1="488" x2="1200" y2="488" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="600" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" font-style="italic">
    &quot;AI adoption isn&apos;t about removing humans. It&apos;s about removing the overhead so the human can focus on judgment.&quot;
  </text>
  <text x="600" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="1">rupakganguly.com</text>

</svg>
