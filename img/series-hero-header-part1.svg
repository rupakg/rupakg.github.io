  <text x="600" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4f6ef7" letter-spacing="2">5-PART BLOG SERIES</text>

  <text x="600" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#1f2937">How I Automated My Weekly AI Newsletter</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#1f2937">with an AI Agentic Workflow</text>

