  <line x1="489" y1="306" x2="505" y2="306" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="697" y1="306" x2="713" y2="306" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="905" y1="306" x2="921" y2="306" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

