    <path d="M10,0 C4.5,0 0,4.5 0,10 C0,14.5 2.5,18 6,19.5 L6,22 L14,22 L14,19.5 C17.5,18 20,14.5 20,10 C20,4.5 15.5,0 10,0 Z" fill="#fdf2f8"/>
