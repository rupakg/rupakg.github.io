  <text x="1016" y="343" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1f2937">What Broke</text>
  <!-- Card description -->
  <text x="1016" y="361" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Actual outputs, real</text>
  <text x="1016" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">failures, and how to</text>
